<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0b090f"/>
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.25"/>
  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="190" fill="#13111c"/>
  <!-- Cross vertical bar -->
  <rect x="232" y="96" width="48" height="320" rx="8" fill="#d4af37"/>
  <!-- Cross horizontal bar -->
  <rect x="120" y="176" width="272" height="48" rx="8" fill="#d4af37"/>
  <!-- Subtle inner highlight on cross -->
  <rect x="244" y="96" width="16" height="320" rx="4" fill="#e5c353" opacity="0.4"/>
  <rect x="120" y="188" width="272" height="16" rx="4" fill="#e5c353" opacity="0.4"/>
  <!-- Small radiant dots at compass points -->
  <circle cx="256" cy="60" r="5" fill="#d4af37" opacity="0.5"/>
  <circle cx="256" cy="452" r="5" fill="#d4af37" opacity="0.5"/>
  <circle cx="60" cy="256" r="5" fill="#d4af37" opacity="0.5"/>
  <circle cx="452" cy="256" r="5" fill="#d4af37" opacity="0.5"/>
</svg>
